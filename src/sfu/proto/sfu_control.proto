syntax = "proto3";
package sfu_control;

// Control-plane interface between the signaling_server (gRPC client) and the
// SFU (gRPC server). The signaling_server's WebSocket gateway translates
// browser-side Protobuf envelopes (Sdp / IceCandidate / JoinVoice / etc.)
// into these RPCs. The actual audio/video bytes never touch this path —
// they flow directly browser <-> SFU over WebRTC's encrypted UDP transport
// once SDP + ICE have completed via these calls.
//
// Reuses signaling.Sdp and signaling.IceCandidate so the gateway can shuttle
// envelope bodies straight through without remapping.

import "signaling.proto";

service SfuControl
{

    // Hand a browser's SDP offer to the SFU. The SFU builds a libdatachannel
    // PeerConnection for (room_id, peer_id), applies the offer, and returns
    // its answer SDP. Idempotent on (room_id, peer_id) — re-calling replaces
    // the previous peer registered under that key.
    rpc AddPeer(AddPeerRequest) returns (AddPeerResponse);

    // Tear down a peer connection and drop the peer from its room. If the
    // room becomes empty, RoomRegistry destroys it.
    rpc RemovePeer(RemovePeerRequest) returns (RemovePeerResponse);

    // Trickle a remote (browser-side) ICE candidate into the named peer.
    rpc AddRemoteIceCandidate(AddRemoteIceCandidateRequest) returns (AddRemoteIceCandidateResponse);

    // Server-streaming subscription to events the SFU emits: locally-gathered
    // ICE candidates (which the gateway forwards to the browser as
    // IceCandidate envelopes) and PeerReady when the peer connection reaches
    // Connected. Typically one stream per signaling_server instance for the
    // lifetime of the process.
    rpc StreamPeerEvents(StreamPeerEventsRequest) returns (stream PeerEvent);

    // Tell the SFU that a specific SDP m-line on a given peer carries
    // screen-capture video. The next SDP renegotiation from that browser
    // will bring the new track up; this RPC must arrive BEFORE the
    // renegotiated offer so onTrack can dispatch the inbound RTP to the
    // screen forwarder rather than the camera forwarder. When sharing=false
    // the SFU forgets the mid so any future re-use of that m-line falls
    // back to the camera path. Also triggers an SFU-initiated renegotiation
    // on every OTHER peer in the room when sharing=true so they grow an
    // outbound screen track to receive the share through; those peers will
    // each emit a PeerEvent.renegotiation_offer back on the StreamPeerEvents
    // stream that the signaling_server forwards as server_sdp_offer.
    rpc MarkScreenShare(MarkScreenShareRequest) returns (MarkScreenShareResponse);

    // Browser's SDP answer to an SFU-initiated renegotiation offer that was
    // shipped down via PeerEvent.renegotiation_offer / server_sdp_offer. The
    // SFU finalizes the renegotiation by calling setRemoteDescription with
    // this answer; the new track is fully usable from this point on.
    rpc AcceptRenegotiationAnswer(AcceptRenegotiationAnswerRequest) returns (AcceptRenegotiationAnswerResponse);

}

message AddPeerRequest
{

    string room_id = 1; // logical channel / room
    string peer_id = 2; // unique within the room (typically user_id + session)
    signaling.Sdp offer = 3; // browser's SDP offer

}

message AddPeerResponse
{

    signaling.Sdp answer = 1; // SFU's SDP answer

}

message RemovePeerRequest
{

    string room_id = 1;
    string peer_id = 2;

}

message RemovePeerResponse
{



}

message AddRemoteIceCandidateRequest
{

    string room_id = 1;
    string peer_id = 2;
    signaling.IceCandidate candidate = 3;

}

message AddRemoteIceCandidateResponse
{



}

message StreamPeerEventsRequest
{



}

message MarkScreenShareRequest
{

    string room_id = 1;
    string peer_id = 2;
    string mid     = 3; // SDP media-line identifier of the screen track
    bool   sharing = 4; // true when starting, false when stopping

}

message MarkScreenShareResponse
{



}

message AcceptRenegotiationAnswerRequest
{

    string        room_id = 1;
    string        peer_id = 2;
    signaling.Sdp answer  = 3; // browser's SDP answer to an SFU-initiated offer

}

message AcceptRenegotiationAnswerResponse
{



}

// Multiplexed event the SFU emits on the StreamPeerEvents stream.
message PeerEvent
{

    string room_id = 1; // room this event belongs to
    string peer_id = 2; // peer this event belongs to

    oneof event
    {

        signaling.IceCandidate local_ice_candidate = 3; // SFU-side gathered candidate; route to browser
        bool                   peer_ready          = 4; // peer connection reached Connected
        signaling.Sdp          renegotiation_offer = 5; // SFU-initiated SDP offer (e.g. growing a screen consumer track); gateway forwards as server_sdp_offer

    }

}
