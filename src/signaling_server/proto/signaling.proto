syntax = "proto3";
package signaling;

// Every WebSocket frame on the gateway is exactly one Envelope,
// serialized as binary protobuf. The `oneof payload` is the type
// discriminator (analogous to Discord's gateway `op` code).

message Envelope
{

  uint64 seq = 1; // monotonic per-sender; used for client dedup / resume

  oneof payload
  {

    // ---- client -> server ----
    Hello                hello                  = 10;
    Heartbeat            heartbeat              = 11;
    SendMessage          send_message           = 12;
    FetchHistory         fetch_history          = 13;
    JoinVoice            join_voice             = 14; // native client asks to join a voice room
    LeaveVoice           leave_voice            = 15; // native client leaves a voice room
    SendFriendRequest    send_friend_request    = 20; // "I want to friend user X"
    AcceptFriendRequest  accept_friend_request  = 21; // "I accept X's friend request"
    RejectFriendRequest  reject_friend_request  = 22; // "delete X's pending request without becoming friends"
    FetchFriends         fetch_friends          = 23; // "list my friends + pending incoming requests"
    LookupUser           lookup_user            = 24; // "find a user by email (so the GUI doesn't make the user paste a Google sub)"
    JoinChannel          join_channel           = 25; // create-or-join a group channel by name
    ListChannels         list_channels          = 26; // "list every public group channel" (browse modal)

    // ---- server -> client ----
    Ready                       ready                          = 30;
    HeartbeatAck                heartbeat_ack                  = 31;
    ChatMessageEvent            chat_message_event             = 32;
    HistoryResponse             history_response               = 33;
    VoicePeerJoined             voice_peer_joined              = 34; // someone else joined this voice room — here's their UDP endpoint + SSRC
    VoicePeerLeft               voice_peer_left                = 35;
    ErrorEvent                  error                          = 36;
    FriendRequestEvent          friend_request_event           = 42; // delivered to recipient in real time
    FriendListResponse          friend_list_response           = 43; // reply to FetchFriends
    FriendRequestAcceptedEvent  friend_request_accepted_event  = 44; // delivered to original requester on accept
    LookupUserResponse          lookup_user_response           = 45; // reply to LookupUser
    ChannelJoinedEvent          channel_joined_event           = 46; // reply to JoinChannel — membership confirmed
    ChannelListResponse         channel_list_response          = 47; // reply to ListChannels

    // ---- calls (both directions: client sends, server relays to the target user) ----
    CallInvite                  call_invite                    = 50; // "ring user X in channel Y"
    CallAccept                  call_accept                    = 51; // callee joined — caller should start media
    CallDecline                 call_decline                   = 52; // callee said no
    CallEnd                     call_end                       = 53; // either side hung up (or caller cancelled the ring)

    // ---- local IPC only (never on the WebSocket wire) ----
    ClientStats                 client_stats                   = 60; // network child -> GUI parent, one per stats tick
    SelectDevices               select_devices                 = 61; // GUI parent -> network child: camera / screenshare target choice

    // Tags 16-19 and 37-41 are reserved — they used to carry the WebRTC
    // SDP / ICE / screen-share envelopes for the browser+libdatachannel
    // SFU pathway. That code lives on branch archive/webrtc-sfu. The
    // native client now does media via a UDP relay using my own packet
    // format; no SDP/ICE on the gateway anymore.

  }

}

// ---- auth / lifecycle ----

message Hello
{

  string user_id    = 1;
  string auth_token = 2;

}

message Ready
{

  string session_id           = 1;
  repeated string channel_ids = 2; // channels this user is subscribed to
  string avatar_url           = 3; // your own Google profile picture URL (empty for dev users)

}

message Heartbeat    { uint64 nonce = 1; }
message HeartbeatAck { uint64 nonce = 1; }

// ---- chat ----

message SendMessage
{

  string client_nonce = 1; // client-generated, echoed back for dedup
  string channel_id   = 2;
  string content      = 3;

}

message ChatMessageEvent
{

  string message_id      = 1; // canonical id assigned by server (e.g. Scylla TimeUUID)
  string client_nonce    = 2;
  string channel_id      = 3;
  string sender_id       = 4;
  string content         = 5;
  int64  timestamp_ms    = 6;
  string sender_username = 7; // display name resolved server-side so receivers never show a raw id

}

message FetchHistory
{

  string request_id        = 1;
  string channel_id        = 2;
  string before_message_id = 3; // paginate: messages older than this
  uint32 limit             = 4; // server-clamped

}

message HistoryResponse
{

  string request_id              = 1;
  repeated ChatMessageEvent msgs = 2;

}

// ---- voice signaling ----
// When a client joins a voice channel, the gateway tells every other
// member their UDP endpoint + SSRC. Audio/video frames flow over the
// native UDP transport (my Packet format) directly to the relay on EC2
// which fans them out to the rest of the room.

message JoinVoice  { string channel_id = 1; }
message LeaveVoice { string channel_id = 1; }

message VoicePeer
{

  string user_id = 1;
  string ip      = 2; // peer's reachable UDP address (or the relay's, depending on topology)
  uint32 port    = 3;
  uint32 ssrc    = 4; // identifier this peer stamps into every Packet header

}

message VoicePeerJoined
{

  string    channel_id = 1;
  VoicePeer peer       = 2;

}

message VoicePeerLeft
{

  string channel_id = 1;
  string user_id    = 2;

}

// ---- friends / DMs ----
// A friend request is a directed pending row in friend_requests, indexed
// by the recipient. Accepting it inserts two rows in friendships (both
// directions) and creates a 1-on-1 DM channel keyed by sorted user_ids
// so both sides derive the same channel_id deterministically.

message SendFriendRequest
{

  // The user_id you want to friend. Must be the Google `sub` of an
  // existing user (sub-form, not email — that's what's stored).
  string to_user_id = 1;

}

message AcceptFriendRequest
{

  // The user_id whose pending request you're accepting. Server looks
  // for the row in friend_requests((self), from_user_id) and ignores
  // the call if no such row exists.
  string from_user_id = 1;

}

message RejectFriendRequest
{

  // Just deletes the pending row in friend_requests((self), from_user_id).
  string from_user_id = 1;

}

message FetchFriends { }

message FriendSummary
{

  string user_id        = 1;
  string username       = 2; // display name from the users table
  string dm_channel_id  = 3; // shared 1-on-1 channel — both sides hold this same value
  int64  since_ms       = 4; // friendship.since as ms since epoch
  string avatar_url     = 5; // Google profile picture URL (empty when none)

}

message PendingFriendRequest
{

  string from_user_id      = 1;
  string from_username     = 2; // joined from users.username for display
  int64  created_at_ms     = 3;

}

message FriendListResponse
{

  repeated FriendSummary        friends   = 1;
  repeated PendingFriendRequest incoming  = 2; // requests waiting on this user

}

message FriendRequestEvent
{

  string from_user_id   = 1;
  string from_username  = 2;
  int64  created_at_ms  = 3;

}

message FriendRequestAcceptedEvent
{

  string user_id        = 1; // the new friend's user_id
  string username       = 2; // their display name
  string dm_channel_id  = 3; // the shared DM channel just created

}


message LookupUser
{

  string request_id = 1; // client-generated, echoed in the response for correlation
  string email      = 2; // exact-match for now; could grow to prefix search later

}

message LookupUserResponse
{

  string request_id  = 1;
  bool   found       = 2;
  string user_id     = 3; // empty when found=false
  string username    = 4;
  string email       = 5;

}

// ---- group channels ----
// A group channel is any non-dm row in `channels`. JoinChannel is
// create-or-join: the gateway normalizes the requested name into a
// channel_id (lowercase, [a-z0-9-_]), inserts the channel row if it's
// new, records membership in both indices, subscribes the socket, and
// confirms with ChannelJoinedEvent. ListChannels feeds the browse
// modal with every public channel; DMs are excluded.

message JoinChannel  { string name = 1; }
message ListChannels { }

message ChannelJoinedEvent { string channel_id = 1; }

message ChannelInfo
{

  string channel_id = 1;
  string name       = 2;
  string kind       = 3; // 'text' or 'voice'

}

message ChannelListResponse { repeated ChannelInfo channels = 1; }

// ---- calls ----
// Discord-style ring/join: nothing auto-connects. The caller sends
// CallInvite naming the channel and the target user; the gateway stamps
// the caller's identity and relays to every live session of the target.
// The callee answers with CallAccept (both sides then JoinVoice) or
// CallDecline. CallEnd tears the call down from either side and also
// cancels an unanswered ring.

message CallInvite
{

  string channel_id      = 1; // DM/group channel the call lives in (used as the voice room)
  string from_user_id    = 2; // stamped by the server from the session
  string from_username   = 3; // stamped by the server for the ringing UI
  string to_user_id      = 4; // whom to ring (set by the caller)
  string from_avatar_url = 5; // stamped by the server — caller's profile picture

}

message CallAccept
{

  string channel_id   = 1;
  string from_user_id = 2; // stamped by the server
  string to_user_id   = 3; // the original caller (set by the callee)

}

message CallDecline
{

  string channel_id   = 1;
  string from_user_id = 2; // stamped by the server
  string to_user_id   = 3; // the original caller (set by the callee)

}

message CallEnd
{

  string channel_id   = 1;
  string from_user_id = 2; // stamped by the server
  string to_user_id   = 3; // the other party (set by whoever hangs up)

}

// ---- local IPC device selection (GUI parent -> network child) ----
// Sent when the user picks a camera or screenshare target in the GUI's
// device prompt. The network child reopens the capture pipeline with the
// new target; it never reaches the WebSocket wire.

message SelectDevices
{

  string camera_device = 1; // e.g. "/dev/video2"; "synthetic" = test pattern; empty = leave camera alone
  uint64 screen_window = 2; // X11 window id to grab; 0 = auto (largest window)
  bool   set_screen    = 3; // true when screen_window is intentional (0 is a valid "auto" choice)

}

// ---- local IPC stats (network child -> GUI parent) ----
// One of these per stats tick. Mirrors the [net-stats]/[vid-stats] log
// lines + CSV row so the GUI can render a live overlay without parsing
// text. Never serialized onto the WebSocket wire.

message ClientStats
{

  double elapsed_s             = 1;  // seconds since the network child started
  uint32 audio_sources         = 2;  // live remote audio SSRCs in the mixer
  uint64 packets_observed      = 3;  // audio packets seen across all jitter buffers
  uint64 packets_lost          = 4;  // audio packets presumed lost
  uint64 packets_ooo           = 5;  // audio packets that arrived out of order
  double jitter_ms             = 6;  // RFC3550-style interarrival jitter estimate
  uint64 jb_buffered           = 7;  // packets currently buffered across jitter buffers
  uint64 jb_threshold          = 8;  // current adaptive playout threshold (packets)
  uint64 jb_adaptations        = 9;  // times the threshold was re-tuned
  uint64 drop_overflow         = 10; // mic->net queue overflow drops
  uint64 packets_sent          = 11; // audio packets sent to the relay
  uint64 plc_concealments      = 12; // Opus PLC frames synthesized
  uint32 peers                 = 13; // live voice peers in the room
  string rtt_summary           = 14; // per-peer RTT fragment, preformatted by the prober
  uint32 video_sources         = 15; // live remote video SSRCs in the router
  uint64 vid_packets_lost      = 16; // video packets presumed lost
  uint64 vid_frames_decoded    = 17; // video frames fully decoded
  uint64 vid_frames_concealed  = 18; // video frames concealed (missing data)
  uint64 vid_frames_rendered   = 19; // video frames handed to the GUI
  uint64 vid_frames_sent       = 20; // camera frames encoded + sent
  uint64 scr_frames_sent       = 21; // screen-share frames encoded + sent

}

// ---- errors ----

message ErrorEvent
{

  uint32 code    = 1;
  string message = 2;

}
