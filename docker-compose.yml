services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    # host port 9092 is locked inside Hyper-V's dynamic excluded range
    # (9077-9176 on this machine); host-side we expose 19092 instead.
    # The container internal listener stays on 9092.
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  scylla:
    image: scylladb/scylla:5.4
    ports:
      - "9042:9042"
    command:
      - --smp=1
      - --memory=750M
      - --overprovisioned=1
      - --developer-mode=1
    volumes:
      - scylla-data:/var/lib/scylla

volumes:
  scylla-data:
