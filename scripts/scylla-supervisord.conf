[supervisord]
nodaemon=true

; Stock scylla image binds supervisord's HTTP control interface to
; 127.0.0.1:9001 — exactly the port the signaling_server gateway wants.
; Move it to 127.0.0.1:9101 (arbitrary unused localhost port) so they
; don't fight over it. Mounted into the scylla container via
; compose.prod.yml's bind-mount.
[inet_http_server]
port = 127.0.0.1:9101

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]

[include]
files = /etc/supervisord.conf.d/*.conf
