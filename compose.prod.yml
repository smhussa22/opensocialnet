# Production stack — everything for OpenSocialNet on a single host.
#
# Every service runs in network_mode: host. No Docker port-mapping, no
# bridge network, no per-port iptables rules. This avoids the failure
# mode we hit deploying with a 50000-60000/udp port forward (Docker
# took 30+ min to install 10000 NAT rules and wedged its own daemon
# in the process). Host networking means each container's listening
# socket binds directly on the EC2 instance's network namespace.
#
# Side-effects of host networking:
# - All inter-service traffic goes through 127.0.0.1 / localhost.
#   signaling_server's defaults (127.0.0.1:9042 / localhost:19092 /
#   127.0.0.1:50051) work as-is — no env-var overrides needed.
# - The EC2 security group must allow:
#     22/tcp     SSH
#     9001/tcp   WebSocket gateway (native client connects here)
#     <future>/udp  native voice/video relay (TBD, will be opened
#                   in a later phase when src/relay/ ships)
#   Nothing else needs to be public; Scylla, Kafka are all
#   loopback-only from this host's perspective.
#
# Deploy assumes images are loaded from a tarball (built on a dev
# laptop and shipped via scp). The `build:` declarations remain so
# `docker compose build` still works locally, but compose won't
# rebuild on EC2 if the image already exists.
#
# Bring up:
#   export OPENSOCIALNET_AUTH_SECRET=devsecret123
#   docker compose -f compose.prod.yml up -d
# Tear down:
#   docker compose -f compose.prod.yml down

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    network_mode: host
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    network_mode: host
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      # zookeeper is on the same host now, so localhost:2181 (no DNS).
      KAFKA_ZOOKEEPER_CONNECT: localhost:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092
      # advertised address is what kafka tells clients to reconnect to.
      # with host networking, clients (signaling_server on same host)
      # reach kafka over localhost. avoid 9092 because Hyper-V's Windows
      # port exclusion blocks it for cross-tool dev use.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:5.4
    network_mode: host
    # Under network_mode: host scylla's default listen-address auto-picks
    # the EC2's primary (private) interface (172.31.x.x), not loopback —
    # so signaling_server's SCYLLA_HOST=127.0.0.1 hits "connection refused".
    # Pin every address arg to loopback so the whole stack talks to scylla
    # over 127.0.0.1 consistently. seeds must match listen-address or scylla
    # rejects the boot with "this node has not been bootstrapped".
    command:
      - --smp=1
      - --memory=750M
      - --overprovisioned=1
      - --developer-mode=1
      - --listen-address=127.0.0.1
      - --rpc-address=127.0.0.1
      - --broadcast-address=127.0.0.1
      - --broadcast-rpc-address=127.0.0.1
      - --seeds=127.0.0.1
    volumes:
      - scylla-data:/var/lib/scylla
      # Override the stock image's supervisord HTTP control port (127.0.0.1:9001)
      # so it stops fighting signaling_server's gateway for that port.
      - ./scripts/scylla-supervisord.conf:/etc/supervisord.conf:ro
    restart: unless-stopped

  signaling_server:
    build:
      context: .
      dockerfile: src/signaling_server/Dockerfile
    image: opensocialnet-signaling
    network_mode: host
    depends_on:
      - scylla
      - kafka
    environment:
      # Caller must set this in env / .env; signaling_server rejects every
      # Hello frame if the secret is empty.
      OPENSOCIALNET_AUTH_SECRET: "${OPENSOCIALNET_AUTH_SECRET:?set OPENSOCIALNET_AUTH_SECRET in env / .env}"
      # main.cc's defaults (SCYLLA_HOST=127.0.0.1, KAFKA_BOOTSTRAP=localhost:19092)
      # resolve correctly under host networking, so no overrides here.
    restart: unless-stopped

volumes:
  scylla-data:
